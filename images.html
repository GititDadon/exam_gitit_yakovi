
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./images.css">
    <title>Images</title>
</head>
<body>

    
    <nav>
        <ul id="logo">
            <a href="index.html">
                <img  src="/Test/images/gpt.png" alt="ERROR"  >
            </a> </ul>
       
        <div class="login">
            <li>
                <button class="Login">Log In</button>
            </li>
            <li>
                <button class="sign-up">Sign Up For Free</button>
            </li>
        </div>
    </nav>

    <section class="page">
        <h1>Images</h1>

        <h2>Try a Style On An Image</h2>

        <div class="arrows">
            <button class="next" type="button">&lt;</button>
            <button class="back" type="button">&gt;</button>
        </div>

        <section class="images">

            <figure>
                <img src="/Test/images/1.jpg" alt="Sketch style">
                <figcaption>Sketch</figcaption>
            </figure>

            <figure>
                <img src="/Test/images/6.jpg" alt="Dramatic style">
                <figcaption>Dramatic</figcaption>
            </figure>

            <figure>
                <img src="/Test/images/3.jpg" alt="Abstract style">
                <figcaption>Abstract</figcaption>
            </figure>

            <figure>
                <img src="/Test/images/4.jpg" alt="Inspire style">
                <figcaption>Inspire</figcaption>
            </figure>

            <figure>
                <img src="/Test/images/5.jpg" alt="Imagination style">
                <figcaption>Imagination</figcaption>
            </figure>

            <figure>
                <img src="/Test/images/2.jpg" alt="Places style">
                <figcaption>Places</figcaption>
            </figure>

        </section>
    </section>

    <!-- DISCOVER SECTION -->
    

    <section class="discover">

        <h2>Discover something new</h2>
       
        <div class="pic">
            
            <div class="discover-item">
                <img src="/Test/images/1.jpg" alt="Sketch">
                <span>Sketch</span>
            </div>

            <div class="discover-item">
                <img src="/Test/images/2.jpg" alt="Places">
                <span>Places</span>
            </div>

            <div class="discover-item">
                <img src="/Test/images/3.jpg" alt="Abstract">
                <span>Abstract</span>
            </div>

        </div>

        <div class="pic2">

            <div class="discover-item">
                <img src="/Test/images/4.jpg" alt="Inspire">
                <span>Inspire</span>
            </div>

            <div class="discover-item">
                <img src="/Test/images/5.jpg" alt="Imagination">
                <span>Imagination</span>
            </div>

            <div class="discover-item">
                <img src="/Test/images/6.jpg" alt="Dramatic">
                <span>Dramatic</span>
            </div>

        </div>

    </section>

</body>
</html>
